# Paste under `jobs:` in .github/workflows/release.yml. Only for stacks whose lockfile stores the project's own version (uv, Ruby gems).
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-please--branches--main
          token: ${{ secrets.GH_TOKEN }}    # a push with GITHUB_TOKEN would not re-run CI
      # STACK: lockfile tool, e.g. `- uses: astral-sh/setup-uv@v7` then `- run: uv lock`
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "Lockfile already matches"; exit 0; fi
          git commit -am "chore: refresh lockfile for release"
          git push
